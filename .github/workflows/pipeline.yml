name: Live detection pipeline

# Hourly: pull candles, score with the ONNX model, publish the dashboard.
# Weekly (Monday 02:xx UTC) or on demand: retrain the autoencoder with PyTorch.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Force retraining"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore state from live-data branch
        run: |
          mkdir -p models docs/data
          if git fetch --depth 1 origin live-data; then git archive FETCH_HEAD | tar -x -C .; fi

      - name: Ingest live candles
        run: python -m cad.ingest

      - name: Decide whether to retrain
        id: decide
        run: |
          if [ ! -f models/autoencoder.onnx ] || [ "${{ inputs.retrain }}" = "true" ] || \
             { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "02" ]; }; then
            echo "retrain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrain autoencoder (CPU PyTorch)
        if: steps.decide.outputs.retrain == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript
          python -m cad.train

      - name: Score markets
        run: python -m cad.detect

      - name: Save state to live-data branch
        run: |
          STATE=$(mktemp -d)
          mkdir -p "$STATE/models" "$STATE/docs/data"
          cp models/autoencoder.onnx models/meta.json "$STATE/models/"
          cp docs/data/events.csv docs/data/latest.json "$STATE/docs/data/"
          cd "$STATE"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
